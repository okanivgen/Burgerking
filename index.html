  #kimlikEkrani { text-align: center; }

  #gonderimDurum { font-size: 14px; color: #aaa; margin-top: 10px; min-height: 18px; }

.soru { font-size: 22px; margin-bottom: 25px; line-height: 1.5; }
.secenek { background: #0f3460; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
.secenek:hover { background: #133b74; }
.secenek.secili { border-color: #e94560; background: #2c2f58; }
.dogru { background: #27ae60!important; border-color: #27ae60!important; }
.yanlis { background: #e74c3c!important; border-color: #e74c3c!important; }
  #sonucEkrani { display: none; text-align: center; }
  #sonucEkrani h2 { font-size: 32px; }
.gecti { color: #2ecc71; }
.kaldi { color: #e74c3c; }
  button { background: #e94560; color: white; border: none; padding: 14px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 15px; }

let mevcutSoru = 0;
let cevaplar = [];
let toplamAlinanPuan = 0;
let barajPuan = 80;
let katilimciAd = '';
let katilimciSoyad = '';

// ↓↓↓ BURAYA Google Apps Script "Web App" URL'ini yapıştıracaksın (aşağıdaki kurulum adımlarına bak)
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHZoxkzL7scklQrujPgkg1LgqoGuU-B3fh6Q5GKO6k06Ab6HL5_UJJVRUlm5MVmS5K/exec";

function kimlikOnayla() {
  const ad = document.getElementById('adInput').value.trim();
  const soyad = document.getElementById('soyadInput').value.trim();
  const uyari = document.getElementById('kimlikUyari');
  if (!ad || !soyad) {
    uyari.innerText = 'Lütfen adını ve soyadını eksiksiz gir.';
    return;
  }
  katilimciAd = ad;
  katilimciSoyad = soyad;
  document.getElementById('kimlikEkrani').style.display = 'none';
  document.getElementById('ayarlar').style.display = 'block';
}

function sonucuGoogleSheetseGonder() {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.indexOf('BURAYA') !== -1) return;

  const detayliCevaplar = sorular.map((s, i) => ({
    soru: s.soru,
    verilenCevap: cevaplar[i] !== undefined ? s.secenekler[cevaplar[i]] : '(boş)',
    dogruCevap: s.secenekler[s.dogru],
    dogruMu: cevaplar[i] === s.dogru
  }));

  const veri = {
    ad: katilimciAd,
    soyad: katilimciSoyad,
    tarih: new Date().toLocaleString('tr-TR'),
    puan: toplamAlinanPuan,
    toplamPuan: document.getElementById('toplamPuan').value,
    baraj: barajPuan,
    sonuc: toplamAlinanPuan >= barajPuan ? 'GEÇTİ' : 'KALDI',
    cevaplar: detayliCevaplar
  };

  const durum = document.getElementById('gonderimDurum');
  if (durum) durum.innerText = 'Sonuç kaydediliyor...';

  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(veri)
  }).then(() => {
    if (durum) durum.innerText = '✅ Sonuç kaydedildi.';
  }).catch(() => {
    if (durum) durum.innerText = '⚠️ Sonuç kaydedilemedi (internet bağlantını kontrol et).';
  });
}
// Hafif seçenek tıklama sesi
let sesContext;

function tikSesi() {
  try {
    if (!sesContext) {
      sesContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (sesContext.state === 'suspended') {
      sesContext.resume();
    }

    const oscillator = sesContext.createOscillator();
    const gain = sesContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(700, sesContext.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(450, sesContext.currentTime + 0.045);

    gain.gain.setValueAtTime(0.045, sesContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, sesContext.currentTime + 0.06);

    oscillator.connect(gain);
    gain.connect(sesContext.destination);

    oscillator.start();
    oscillator.stop(sesContext.currentTime + 0.06);
  } catch (e) {
    // Tarayıcı ses desteği yoksa sınav normal şekilde devam eder.
  }
}


document.getElementById('soruSayisiBilgi').innerHTML =
  `<b>${sorular.length} adet</b> sorunuz vardır.`;

toplamPuaniGuncelle();

function toplamPuaniGuncelle() {
  let soruPuani = parseFloat(document.getElementById('soruPuani').value) || 0;
  let toplamPuan = soruPuani * sorular.length;
  document.getElementById('toplamPuan').value = toplamPuan;
  document.getElementById('toplamPuanBilgi').innerHTML =
    `Toplam Sınav Puanı: <b>${toplamPuan}</b>`;
}

function sinaviBaslat() {
  barajPuan = parseFloat(document.getElementById('baraj').value) || 0;
  let soruPuani = parseFloat(document.getElementById('soruPuani').value) || 0;
  sorular.forEach(s => s.puan = soruPuani);
  toplamPuaniGuncelle();

  document.getElementById('ayarlar').style.display = 'none';
  soruEkraniOlustur();
  soruyuGoster(0);
}

function soruEkraniOlustur() {
  const alan = document.getElementById('sinavAlani');
  sorular.forEach((s, index) => {
    let html = `<div class="soruEkrani" id="soru${index}">
      <div class="soruNo">Soru ${index+1} / ${sorular.length} - Puan: ${s.puan}</div>
      <div class="soru">${s.soru}</div>`;
    s.secenekler.forEach((sec, i) => {
      html += `<div class="secenek" onclick="cevapla(${index}, ${i})">${String.fromCharCode(65+i)}) ${sec}</div>`;
    });
    html += `</div>`;
    alan.innerHTML += html;
  });
}

function soruyuGoster(index) {
  document.querySelectorAll('.soruEkrani').forEach(s => s.classList.remove('aktif'));
  document.getElementById(`soru${index}`).classList.add('aktif');
}

function cevapla(soruIndex, secenekIndex) {
  tikSesi();
  cevaplar[soruIndex] = secenekIndex;
  let soruDiv = document.getElementById(`soru${soruIndex}`);
  soruDiv.querySelectorAll('.secenek').forEach((el, i) => {
    el.classList.remove('secili');
    if(i === secenekIndex) el.classList.add('secili');
  });

  setTimeout(() => {
    if(soruIndex + 1 < sorular.length) {
      soruyuGoster(soruIndex + 1);
    } else {
      sonucuHesapla();
    }
  }, 400);
}

function sonucuHesapla() {
  toplamAlinanPuan = 0;
  sorular.forEach((s, i) => {
    if(cevaplar[i] === s.dogru) toplamAlinanPuan += s.puan;
  });

  document.getElementById('sinavAlani').style.display = 'none';
  document.getElementById('sonucEkrani').style.display = 'block';

  let gectiMi = toplamAlinanPuan >= barajPuan;
  document.getElementById('sonucBaslik').innerHTML = (gectiMi? '<span class="gecti">🎉 TEBRİKLER GEÇTİNİZ!</span>' : '<span class="kaldi">❌ MAALESEF KALDINIZ</span>') + `<br><small style="color:#aaa;font-size:15px;">${katilimciAd} ${katilimciSoyad}</small>`;
  document.getElementById('sonucPuan').innerHTML = `Puanınız: <b>${toplamAlinanPuan}</b> / ${document.getElementById('toplamPuan').value} <br> Baraj: ${barajPuan}`;

  sonucuGoogleSheetseGonder();
}

function cevapAnahtariniGoster() {
  document.getElementById('sonucEkrani').style.display = 'none';
  document.getElementById('sinavAlani').style.display = 'block';
  soruyuGoster(0);

  sorular.forEach((s, i) => {
    let soruDiv = document.getElementById(`soru${i}`);
    soruDiv.querySelectorAll('.secenek').forEach((el, j) => {
      el.style.pointerEvents = 'none';
      if(j === s.dogru) el.classList.add('dogru');
      if(j === cevaplar[i] && j!== s.dogru) el.classList.add('yanlis');
    });
  });

  let nav = document.createElement('button');
  nav.innerText = 'Sonraki Soru';
  nav.onclick = () => {
    if(mevcutSoru + 1 < sorular.length) {
      mevcutSoru++;
      soruyuGoster(mevcutSoru);
    } else {
      alert('Cevap anahtarı bitti');
    }
  };
  document.getElementById('sinavAlani').appendChild(nav);
}
